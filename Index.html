<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Whispering Woods</title>

  <style>
    body {
      margin: 0;
      background: #101810;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin-top: 50px;
    }

    button {
      font-size: 20px;
      padding: 20px;
      margin: 10px;
      border-radius: 12px;
      background: #263826;
      color: white;
      border: 2px solid #657565;
    }

    #game {
      margin: 30px auto;
      width: 90%;
      max-width: 500px;
      height: 250px;
      background: #18251a;
      border: 3px solid #657565;
      position: relative;
      overflow: hidden;
    }

    #player {
      position: absolute;
      width: 25px;
      height: 25px;
      background: #b64b4b;
      left: 50px;
      top: 100px;
    }
  </style>
</head>

<body>

<h1>🌲 Whispering Woods</h1>

<p>Your adventure begins...</p>

<div id="game">
  <div id="player"></div>
</div>

<button onclick="moveLeft()">◀</button>
<button onclick="moveRight()">▶</button>

<script>

let player = document.getElementById("player");

let position = 50;

function moveLeft() {
  position -= 10;

  if (position < 0) {
    position = 0;
  }

  player.style.left = position + "px";
}

function moveRight() {
  position += 10;

  if (position > 450) {
    position = 450;
  }

  player.style.left = position + "px";
}

</script>

</body>
</html>
