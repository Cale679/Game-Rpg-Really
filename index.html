<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Whispering Woods</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#070a08;
    color:white;
    font-family:Arial,sans-serif;
}
body{display:flex;justify-content:center;align-items:center}
canvas{
    width:100vw;
    height:100vh;
    max-width:900px;
    max-height:600px;
    image-rendering:pixelated;
}
#classScreen{
    position:fixed;
    inset:0;
    background:#050806f2;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:10;
    padding:20px;
}
.panel{
    max-width:600px;
    width:100%;
    background:#151b17;
    border:2px solid #596357;
    border-radius:14px;
    padding:25px;
    text-align:center;
}
.classes{display:flex;gap:10px}
.classButton{
    flex:1;
    padding:18px 8px;
    background:#202820;
    color:white;
    border:1px solid #596357;
    border-radius:10px;
    font-weight:bold;
}
.classButton small{
    display:block;
    color:#adb7aa;
    margin-top:8px;
    font-weight:normal;
}
#hud{
    position:fixed;
    top:8px;
    left:10px;
    font:13px monospace;
    text-shadow:2px 2px #000;
    pointer-events:none;
}
#message{
    position:fixed;
    bottom:145px;
    left:50%;
    transform:translateX(-50%);
    background:#050806e8;
    border:1px solid #687568;
    border-radius:8px;
    padding:10px;
    text-align:center;
    display:none;
    max-width:85%;
}
#controls{
    position:fixed;
    bottom:15px;
    left:15px;
    right:15px;
    height:115px;
    pointer-events:none;
}
.control{
    position:absolute;
    width:40px;
    height:40px;
    background:#263027dd;
    color:white;
    border:1px solid #69756a;
    border-radius:8px;
    pointer-events:auto;
    touch-action:none;
    font-size:18px;
}
.up{left:40px}
.left{left:0;top:42px}
.down{left:40px;top:42px}
.right{left:80px;top:42px}
.attack{
    right:0;
    top:15px;
    width:70px;
    height:70px;
    border-radius:50%;
    font-size:11px;
    font-weight:bold;
}
@media(max-width:500px){
    .classes{flex-direction:column}
}
</style>
</head>

<body>

<canvas id="game" width="450" height="300"></canvas>

<div id="classScreen">
<div class="panel">
<h1>WHISPERING WOODS</h1>

<p>
You awaken beneath ancient trees.<br>
A distant lantern flickers through the forest...
</p>

<div class="classes">

<button class="classButton" onclick="chooseClass('Melee')">
⚔️ MELEE
<small>High health<br>Powerful close combat</small>
</button>

<button class="classButton" onclick="chooseClass('Ranger')">
🏹 RANGER
<small>Fast movement<br>Long-range attacks</small>
</button>

<button class="classButton" onclick="chooseClass('Wizard')">
🔮 WIZARD
<small>Powerful magic<br>Long-range spells</small>
</button>

</div>
</div>
</div>

<div id="hud"></div>
<div id="message"></div>

<div id="controls">

<button class="control up" data-key="up">▲</button>
<button class="control left" data-key="left">◀</button>
<button class="control down" data-key="down">▼</button>
<button class="control right" data-key="right">▶</button>
<button class="control attack" data-key="attack">ATTACK</button>

</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const W=450;
const H=300;

/* WORLD IS NOW MUCH BIGGER */

const WORLD_W=1800;
const WORLD_H=1200;

let player;
let selectedClass;
let enemies=[];
let trees=[];
let rocks=[];
let chests=[];
let camera={x:0,y:0};

let keys={
    up:false,
    down:false,
    left:false,
    right:false,
    attack:false
};

let attackCooldown=0;
let messageTimer=0;


/* =========================
   WORLD GENERATION
========================= */

function createWorld(){

    trees=[];
    rocks=[];
    enemies=[];
    chests=[];

    /*
       Forest trees
    */

    for(let i=0;i<420;i++){

        let x=Math.random()*WORLD_W;
        let y=Math.random()*WORLD_H;

        /*
           Keep the village relatively open.
        */

        if(x>1450 && y<330) continue;

        trees.push({
            x:x,
            y:y,
            size:7+Math.random()*9
        });
    }


    /*
       Rocks
    */

    for(let i=0;i<100;i++){

        rocks.push({
            x:Math.random()*WORLD_W,
            y:Math.random()*WORLD_H,
            size:3+Math.random()*5
        });

    }


    /*
       Enemies
    */

    for(let i=0;i<25;i++){

        let type=Math.random()<0.6?"Wolf":"Bandit";

        enemies.push({
            x:150+Math.random()*1300,
            y:100+Math.random()*900,
            hp:type==="Wolf"?25:40,
            maxHp:type==="Wolf"?25:40,
            type:type,
            speed:type==="Wolf"?.25:.18
        });

    }


    /*
       Hidden chests
    */

    for(let i=0;i<12;i++){

        chests.push({
            x:100+Math.random()*1300,
            y:100+Math.random()*900,
            opened:false
        });

    }

}


/* =========================
   PLAYER
========================= */

function chooseClass(type){

    selectedClass=type;

    document.getElementById("classScreen").style.display="none";

    if(type==="Melee"){

        player={
            x:120,
            y:950,
            hp:140,
            maxHp:140,
            damage:18,
            speed:1.35,
            range:25,
            level:1,
            xp:0
        };

    }

    if(type==="Ranger"){

        player={
            x:120,
            y:950,
            hp:105,
            maxHp:105,
            damage:14,
            speed:1.85,
            range:60,
            level:1,
            xp:0
        };

    }

    if(type==="Wizard"){

        player={
            x:120,
            y:950,
            hp:80,
            maxHp:80,
            damage:23,
            speed:1.5,
            range:70,
            level:1,
            xp:0
        };

    }

    createWorld();

    showMessage(
        "You awaken in the Whispering Woods. Find Briarwatch."
    );
}


/* =========================
   MESSAGE
========================= */

function showMessage(text){

    const box=document.getElementById("message");

    box.textContent=text;
    box.style.display="block";

    messageTimer=180;
}


/* =========================
   PLAYER MOVEMENT
========================= */

function updatePlayer(){

    if(!player)return;

    let dx=0;
    let dy=0;

    if(keys.left)dx--;
    if(keys.right)dx++;
    if(keys.up)dy--;
    if(keys.down)dy++;

    if(dx||dy){

        const length=Math.hypot(dx,dy);

        dx/=length;
        dy/=length;

        player.x+=dx*player.speed;
        player.y+=dy*player.speed;

    }

    player.x=Math.max(10,Math.min(WORLD_W-20,player.x));
    player.y=Math.max(10,Math.min(WORLD_H-20,player.y));

}


/* =========================
   CAMERA
========================= */

function updateCamera(){

    if(!player)return;

    camera.x=player.x-W/2;
    camera.y=player.y-H/2;

    camera.x=Math.max(0,Math.min(WORLD_W-W,camera.x));
    camera.y=Math.max(0,Math.min(WORLD_H-H,camera.y));

}


/* =========================
   COMBAT
========================= */

function attack(){

    if(!player)return;

    if(attackCooldown>0)return;

    attackCooldown=25;

    let target=null;
    let closest=9999;

    for(const enemy of enemies){

        const distance=Math.hypot(
            enemy.x-player.x,
            enemy.y-player.y
        );

        if(
            distance<player.range+10 &&
            distance<closest
        ){

            target=enemy;
            closest=distance;

        }

    }

    if(!target){

        showMessage("Nothing is in range.");

        return;
    }

    target.hp-=player.damage;

    if(selectedClass==="Wizard")
        showMessage("A bolt of magic tears into the "+target.type+"!");

    else if(selectedClass==="Ranger")
        showMessage("Your arrow strikes the "+target.type+"!");

    else
        showMessage("Your weapon crashes into the "+target.type+"!");


    if(target.hp<=0){

        enemies=enemies.filter(e=>e!==target);

        player.xp+=15;

        showMessage(
            target.type+" defeated! +15 XP"
        );

        if(player.xp>=30){

            player.level++;
            player.xp=0;

            player.damage+=4;
            player.maxHp+=10;
            player.hp=player.maxHp;

            showMessage(
                "LEVEL UP! You are now level "+player.level+"!"
            );

        }

    }

}


/* =========================
   ENEMY AI
========================= */

function updateEnemies(){

    if(!player)return;

    for(const enemy of enemies){

        const dx=player.x-enemy.x;
        const dy=player.y-enemy.y;

        const distance=Math.hypot(dx,dy);

        if(distance<90){

            if(distance>15){

                enemy.x+=(dx/distance)*enemy.speed;
                enemy.y+=(dy/distance)*enemy.speed;

            }else{

                player.hp-=.05;

            }

        }

    }


    if(player.hp<=0){

        showMessage("You have fallen...");

        setTimeout(()=>{
            location.reload();
        },1500);

    }

}


/* =========================
   CHESTS
========================= */

function checkChests(){

    if(!player)return;

    for(const chest of chests){

        const distance=Math.hypot(
            player.x-chest.x,
            player.y-chest.y
        );

        if(distance<22 && !chest.opened){

            chest.opened=true;

            player.xp+=10;

            showMessage(
                "You discovered a hidden chest! +10 XP"
            );

        }

    }

}


/* =========================
   VILLAGE
========================= */

function checkVillage(){

    /*
       Briarwatch occupies the
       northeast corner.
    */

    if(
        player.x>1450 &&
        player.y<330
    ){

        showMessage(
            "BRIARWATCH — The first lights of civilization."
        );

    }

}


/* =========================
   DRAW WORLD
========================= */

function drawWorld(){

    ctx.fillStyle="#101712";
    ctx.fillRect(0,0,W,H);


    /*
       Grass texture
    */

    for(let y=0;y<H;y+=12){

        for(let x=0;x<W;x+=12){

            const wx=Math.floor(x+camera.x);
            const wy=Math.floor(y+camera.y);

            if((wx+wy)%47===0){

                ctx.fillStyle="#16241a";

                ctx.fillRect(
                    x,
                    y,
                    10,
                    10
                );

            }

        }

    }


    /*
       Path toward village
    */

    ctx.fillStyle="#3d382e";

    const pathX=1450-camera.x;

    if(pathX>-20 && pathX<W+20){

        ctx.fillRect(
            pathX,
            0,
            55,
            H
        );

    }


    /*
       Village
    */

    drawVillage();


    /*
       Rocks
    */

    for(const rock of rocks){

        const sx=rock.x-camera.x;
        const sy=rock.y-camera.y;

        if(
            sx<-10 ||
            sx>W+10 ||
            sy<-10 ||
            sy>H+10
        )continue;

        ctx.fillStyle="#454b45";

        ctx.fillRect(
            sx,
            sy,
            rock.size*2,
            rock.size
        );

    }


    /*
       Trees
    */

    for(const tree of trees){

        const sx=tree.x-camera.x;
        const sy=tree.y-camera.y;

        if(
            sx<-30 ||
            sx>W+30 ||
            sy<-30 ||
            sy>H+30
        )continue;

        ctx.fillStyle="#38291f";

        ctx.fillRect(
            sx-2,
            sy,
            5,
            14
        );

        ctx.fillStyle="#1b452a";

        ctx.fillRect(
            sx-tree.size,
            sy-tree.size,
            tree.size*2,
            tree.size*1.6
        );

        ctx.fillStyle="#2b6138";

        ctx.fillRect(
            sx-tree.size+2,
            sy-tree.size+2,
            tree.size,
            5
        );

    }


    /*
       Chests
    */

    for(const chest of chests){

        const sx=chest.x-camera.x;
        const sy=chest.y-camera.y;

        if(
            sx<0 ||
            sx>W ||
            sy<0 ||
            sy>H
        )continue;

        ctx.fillStyle=
            chest.opened
            ?"#4b3827"
            :"#9b672b";

        ctx.fillRect(
            sx,
            sy,
            14,
            9
        );

        ctx.fillStyle="#d7b44c";

        ctx.fillRect(
            sx+5,
            sy+3,
            3,
            3
        );

    }


    /*
       Enemies
    */

    for(const enemy of enemies){

        const sx=enemy.x-camera.x;
        const sy=enemy.y-camera.y;

        if(
            sx<-30 ||
            sx>W+30 ||
            sy<-30 ||
            sy>H+30
        )continue;

        ctx.fillStyle=
            enemy.type==="Wolf"
            ?"#77736c"
            :"#7d3038";

        ctx.fillRect(
            sx,
            sy,
            15,
            15
        );

        ctx.fillStyle="#d44";

        ctx.fillRect(
            sx,
            sy-5,
            15*(enemy.hp/enemy.maxHp),
            2
        );

    }


    /*
       Player stays centered.
    */

    drawPlayer();

}


/* =========================
   VILLAGE
========================= */

function drawVillage(){

    const x=1450-camera.x;
    const y=60-camera.y;

    if(x>W||x+250<0)return;

    ctx.fillStyle="#34372f";

    ctx.fillRect(
        x,
        y,
        260,
        270
    );


    /*
       Houses
    */

    ctx.fillStyle="#73533d";

    ctx.fillRect(x+25,y+50,65,60);
    ctx.fillRect(x+125,y+35,75,70);
    ctx.fillRect(x+70,y+155,70,55);


    /*
       Roofs
    */

    ctx.fillStyle="#392a24";

    ctx.fillRect(x+20,y+38,75,15);
    ctx.fillRect(x+120,y+22,85,15);
    ctx.fillRect(x+65,y+142,80,15);


    /*
       Doors
    */

    ctx.fillStyle="#c49d55";

    ctx.fillRect(x+50,y+82,15,28);
    ctx.fillRect(x+155,y+70,15,35);
    ctx.fillRect(x+95,y+180,15,30);


    /*
       Village sign
    */

    ctx.fillStyle="#6c4b31";

    ctx.fillRect(
        x+105,
        y+225,
        6,
        30
    );

    ctx.fillStyle="#b99255";

    ctx.fillRect(
        x+75,
        y+215,
        70,
        25
    );

    ctx.fillStyle="#eee";

    ctx.font="10px monospace";

    ctx.fillText(
        "BRIARWATCH",
        x+82,
        y+231
    );

}


/* =========================
   PLAYER
========================= */

function drawPlayer(){

    if(!player)return;

    const x=W/2-7;
    const y=H/2-7;

    let color="#a34840";

    if(selectedClass==="Ranger")
        color="#4e8b50";

    if(selectedClass==="Wizard")
        color="#7155ba";

    ctx.fillStyle=color;

    ctx.fillRect(
        x,
        y,
        14,
        14
    );

    ctx.fillStyle="#fff";

    ctx.fillRect(x+3,y+3,2,2);
    ctx.fillRect(x+9,y+3,2,2);

}


/* =========================
   HUD
========================= */

function drawHUD(){

    if(!player)return;

    document.getElementById("hud").textContent=
        selectedClass+
        "  •  Lv "+
        player.level+
        "  •  HP "+
        Math.ceil(player.hp)+
        "/"+
        player.maxHp+
        "  •  XP "+
        player.xp+
        "/30";

}


/* =========================
   UPDATE
========================= */

function update(){

    if(!player)return;

    updatePlayer();
    updateCamera();
    updateEnemies();
    checkChests();
    checkVillage();

    if(attackCooldown>0)
        attackCooldown--;

    if(keys.attack){

        keys.attack=false;

        attack();

    }

    if(messageTimer>0){

        messageTimer--;

        if(messageTimer<=0){

            document.getElementById(
                "message"
            ).style.display="none";

        }

    }

}


/* =========================
   GAME LOOP
========================= */

function loop(){

    update();

    drawWorld();

    drawHUD();

    requestAnimationFrame(loop);

}

loop();


/* =========================
   TOUCH CONTROLS
========================= */

document
.querySelectorAll("[data-key]")
.forEach(button=>{

    const key=button.dataset.key;

    button.addEventListener(
        "pointerdown",
        e=>{
            e.preventDefault();
            keys[key]=true;
        }
    );

    button.addEventListener(
        "pointerup",
        e=>{
            e.preventDefault();
            keys[key]=false;
        }
    );

    button.addEventListener(
        "pointercancel",
        ()=>{
            keys[key]=false;
        }
    );

});


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    e=>{

        if(e.key==="ArrowUp"||e.key==="w")
            keys.up=true;

        if(e.key==="ArrowDown"||e.key==="s")
            keys.down=true;

        if(e.key==="ArrowLeft"||e.key==="a")
            keys.left=true;

        if(e.key==="ArrowRight"||e.key==="d")
            keys.right=true;

        if(e.key===" ")
            keys.attack=true;

    }
);

document.addEventListener(
    "keyup",
    e=>{

        if(e.key==="ArrowUp"||e.key==="w")
            keys.up=false;

        if(e.key==="ArrowDown"||e.key==="s")
            keys.down=false;

        if(e.key==="ArrowLeft"||e.key==="a")
            keys.left=false;

        if(e.key==="ArrowRight"||e.key==="d")
            keys.right=false;

    }
);

</script>

</body>
</html>
